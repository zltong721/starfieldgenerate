[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starfieldgenerate"
version = "0.1.0"
description = "Gaia-based synthetic star-field observation generators"
requires-python = ">=3.11,<3.13"
dependencies = [
  "astropy>=6,<9",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.5,<3",
  "Pillow>=10,<12",
]

[tool.setuptools.packages.find]
where = ["src"]
